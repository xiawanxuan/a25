<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星轨摄影叠加与合成系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>✨ 星轨摄影叠加与合成系统</h1>
      <p class="subtitle">基于Canvas的交互式星轨照片处理工具</p>
    </header>

    <div class="main-content">
      <aside class="sidebar left-sidebar">
        <div class="panel">
          <h2>📁 图像导入</h2>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.raw,.cr2,.nef,.arw,.dng" hidden>
            <div class="upload-content">
              <div class="upload-icon">🌌</div>
              <p>拖拽照片到此处或点击选择</p>
              <p class="upload-hint">支持 JPG、PNG、RAW 格式</p>
            </div>
          </div>
          <div class="file-list" id="fileList">
            <p class="empty-hint">暂无导入的照片</p>
          </div>
        </div>

        <div class="panel">
          <h2>⚙️ 合成参数</h2>
          <div class="control-group">
            <label>合成模式</label>
            <select id="blendMode">
              <option value="lighten">变亮叠加</option>
              <option value="screen">滤色模式</option>
              <option value="max">最大值叠加</option>
              <option value="average">平均叠加</option>
            </select>
          </div>
          <div class="control-group">
            <label>叠加强度: <span id="intensityValue">100</span>%</label>
            <input type="range" id="intensity" min="1" max="200" value="100">
          </div>
          <div class="control-group">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="autoAlign" checked style="width: auto; cursor: pointer;">
              <span>自动对齐恒星</span>
            </label>
            <p style="font-size: 11px; color: #666; margin-top: 4px;">
              基于星点特征匹配，自动校正位移和旋转
            </p>
          </div>
          <button id="stackBtn" class="btn btn-primary" disabled>🎯 开始合成</button>
        </div>
      </aside>

      <main class="canvas-container">
        <div class="canvas-wrapper">
          <canvas id="previewCanvas"></canvas>
          <div class="canvas-placeholder" id="canvasPlaceholder">
            <div class="placeholder-icon">🖼️</div>
            <p>导入照片后在此预览</p>
          </div>
        </div>
        <div class="canvas-toolbar">
          <button class="tool-btn" id="zoomIn" title="放大">🔍+</button>
          <button class="tool-btn" id="zoomOut" title="缩小">🔍-</button>
          <button class="tool-btn" id="zoomReset" title="重置">⟲</button>
          <button class="tool-btn" id="toggleCompare" title="对比原图">↔️</button>
          <span class="zoom-info" id="zoomInfo">100%</span>
        </div>
      </main>

      <aside class="sidebar right-sidebar">
        <div class="panel">
          <h2>🎨 图像调整</h2>
          <div class="control-group">
            <label>亮度: <span id="brightnessValue">0</span></label>
            <input type="range" id="brightness" min="-100" max="100" value="0">
          </div>
          <div class="control-group">
            <label>对比度: <span id="contrastValue">0</span></label>
            <input type="range" id="contrast" min="-100" max="100" value="0">
          </div>
          <div class="control-group">
            <label>饱和度: <span id="saturationValue">0</span></label>
            <input type="range" id="saturation" min="-100" max="100" value="0">
          </div>
        </div>

        <div class="panel">
          <h2>🌓 前景/背景分离</h2>
          <div class="control-group">
            <label>星轨阈值: <span id="thresholdValue">30</span></label>
            <input type="range" id="threshold" min="0" max="255" value="30">
          </div>
          <div class="control-group">
            <label>前景强度: <span id="foregroundValue">100</span>%</label>
            <input type="range" id="foregroundIntensity" min="0" max="200" value="100">
          </div>
          <div class="control-group">
            <label>背景强度: <span id="backgroundValue">100</span>%</label>
            <input type="range" id="backgroundIntensity" min="0" max="200" value="100">
          </div>
          <button id="applySeparation" class="btn btn-secondary" disabled>应用分离</button>
        </div>

        <div class="panel">
          <h2>💾 导出</h2>
          <div class="control-group">
            <label>导出格式</label>
            <select id="exportFormat">
              <option value="png">PNG (无损)</option>
              <option value="jpeg">JPEG (高质量)</option>
            </select>
          </div>
          <div class="control-group">
            <label>导出质量: <span id="qualityValue">95</span>%</label>
            <input type="range" id="exportQuality" min="10" max="100" value="95">
          </div>
          <button id="exportBtn" class="btn btn-success" disabled>📥 导出结果</button>
        </div>
      </aside>
    </div>

    <div class="status-bar">
      <span id="statusText">就绪</span>
      <span id="imageInfo"></span>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
